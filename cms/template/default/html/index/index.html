<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不小心弄丢了</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 自定义配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4A90E2',
            secondary: '#F5F7FA',
            neutral: '#6E7888',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .text-shadow-sm {
        text-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      .animate-pulse-slow {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>

<body class="bg-secondary min-h-screen flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8">
  <!-- 404主容器 -->
  <div class="max-w-md w-full text-center">
    <!-- 装饰元素 -->
    <div class="relative mb-8">
      <div class="absolute -top-10 -left-10 text-primary/10 text-[12rem] font-bold leading-none animate-float">
        404
      </div>
      <div class="relative z-10">
        <div class="w-32 h-32 sm:w-40 sm:h-40 mx-auto bg-primary/10 rounded-full flex items-center justify-center mb-6">
          <i class="fa fa-compass text-primary text-5xl sm:text-6xl animate-pulse-slow"></i>
        </div>
      </div>
    </div>
    
    <!-- 文本内容 -->
    <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-gray-800 mb-4 text-shadow-sm">
      哎呀，页面走丢了
    </h1>
    <p class="text-neutral text-lg mb-8 leading-relaxed">
      地址错误或页面已被移除。<br class="hidden sm:block">
      
    </p>
    
    <!-- 按钮组 -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <a href="/" class="bg-primary hover:bg-primary/90 text-white font-medium py-3 px-8 rounded-lg transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-primary/20">
        <i class="fa fa-home mr-2"></i>返回首页
      </a>
      <a href="javascript:history.back()" class="bg-white hover:bg-gray-50 text-gray-700 font-medium py-3 px-8 rounded-lg border border-gray-200 transition-all duration-300 transform hover:scale-105">
        <i class="fa fa-arrow-left mr-2"></i>返回上一页
      </a>
    </div>
    
    <!-- 页脚 -->
    <div class="mt-12 text-neutral/70 text-sm">
      © 2026 dy.axablog.com
    </div>
  </div>
  
  <!-- 简单的交互效果 -->
  <script>
    // 页面加载动画
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('opacity-100');
      document.body.classList.remove('opacity-0');
    });
    
    // 添加轻微的页面交互反馈
    const buttons = document.querySelectorAll('a');
    buttons.forEach(button => {
      button.addEventListener('click', (e) => {
        e.currentTarget.classList.add('scale-95');
        setTimeout(() => {
          e.currentTarget.classList.remove('scale-95');
        }, 150);
      });
    });
  </script>
</body>
</html>
