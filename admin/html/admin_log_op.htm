            <legend>操作明细</legend>
            <div class="layui-field-box">
                <table class="layui-table">
                    <thead>
                        <tr><th style="width:150px">时间</th><th style="width:80px">类型</th><th style="width:180px">操作</th><th style="width:70px">状态</th><th style="width:100px">账号</th><th style="width:120px">IP</th><th>详情</th></tr>
                    </thead>
                    <tbody id="log-body"><tr><td colspan="7" class="log-empty">加载中…</td></tr></tbody>
                </table>
                <div id="pager" style="text-align:right"></div>

    <script>
    layui.use(['form', 'layer', 'laypage'], function () {
        var form = layui.form, layer = layui.layer, laypage = layui.laypage, $ = layui.jquery;
        var page = 1, size = 20;
        var TYPE_LABEL = {login: '登录', logout: '退出', operation: '操作'};

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
            });
        }

        function renderStats(stats, groups) {
            $('#c-total').text(stats.total || 0);
            $('#c-success').text(stats.success || 0);
            $('#c-fail').text(stats.fail || 0);
            var lok = 0, lfail = 0;
            for (var k in groups) {
                if (!groups.hasOwnProperty(k) || k !== 'login') { continue; }
                lok = groups[k].success || 0;
                lfail = groups[k].fail || 0;
            }
            $('#c-login-ok').text(lok);
            $('#c-login-fail').text(lfail);

            var html = '', n = 0;
            for (var g in groups) {
                if (!groups.hasOwnProperty(g)) { continue; }
                var it = groups[g];
                var rate = it.total > 0 ? Math.round(it.success * 1000 / it.total) / 10 : 0;
                html += '<tr><td>' + esc(TYPE_LABEL[it.name] || it.name || g) + '</td><td>' + it.total + '</td><td>' + it.success + '</td><td>' + it.fail + '</td><td>' + rate + '%</td></tr>';
                n++;
            }
            $('#stat-body').html(n ? html : '<tr><td colspan="5" class="log-empty">暂无数据</td></tr>');
        }

        function renderRows(res) {
            var rows = res.rows || [], html = '';
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                var ok = r.status !== 'fail';
                var type = r.type || 'operation';
                html += '<tr>'
                    + '<td>' + esc(r.t) + '</td>'
                    + '<td><span class="log-tag type">' + esc(TYPE_LABEL[type] || type) + '</span></td>'
                    + '<td>' + esc(r.action) + '</td>'
                    + '<td><span class="log-tag ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '成功' : '失败') + '</span></td>'
                    + '<td>' + esc(r.user) + '</td>'
                    + '<td>' + esc(r.ip) + '</td>'
                    + '<td class="log-detail">' + esc(r.detail) + '</td>'
                    + '</tr>';
            }
            $('#log-body').html(html || '<tr><td colspan="7" class="log-empty">暂无数据</td></tr>');

            laypage.render({
                elem: 'pager',
                count: res.total || 0,
                curr: res.page || 1,
                limit: res.size || 20,
                limits: [20, 50, 100],
                layout: ['count', 'prev', 'page', 'next', 'limit'],
                jump: function (obj, first) {
                    if (first) { return; }
                    page = obj.curr;
                    size = obj.limit;
                    loadLog();
                }
            });
        }

        function loadLog() {
            var data = {
                type: 'log_op_list',
                days: $('#f-days').val(),
                op_type: $('#f-type').val(),
                status: $('#f-status').val(),
                kw: $('#f-kw').val(),
                page: page,
                size: size
            };

            $('#log-body').html('<tr><td colspan="7" class="log-empty">加载中…</td></tr>');
            $.post('admin.php', data, function (res) {
                if (!res || !res.ok) {
                    $('#log-body').html('<tr><td colspan="7" class="log-empty">加载失败</td></tr>');
                    return;
                }
                renderStats(res.stats || {}, (res.stats && res.stats.groups) || {});
                renderRows(res);
            }, 'json').fail(function () {
                $('#log-body').html('<tr><td colspan="7" class="log-empty">请求失败，请检查登录状态</td></tr>');
            });
        }

        $('#btn-search').on('click', function () {
            page = 1;
            loadLog();
        });
        $('#f-days, #f-type, #f-status').on('change', function () {
            page = 1;
            loadLog();
        });
        $('#f-kw').on('keydown', function (e) {
            if (e.keyCode === 13) { page = 1; loadLog(); }
        });
        $('#btn-clear').on('click', function () {
            layer.confirm('确定要清空全部操作日志吗？该操作不可恢复。', {icon: 3, title: '清空操作日志'}, function (idx) {
                layer.close(idx);
                $.post('admin.php', {type: 'log_clear', kind: 'op'}, function (d) {
                    layer.msg(d && d.m ? d.m : '已清空', {icon: 1, time: 1200});
                    page = 1;
                    loadLog();
                }, 'json').fail(function () { layer.msg('操作失败', {icon: 5}); });
            });
        });

        form.render();
        loadLog();
    });
    </script>
</body>
</html>
