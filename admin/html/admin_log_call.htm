                    </thead>
                    <tbody id="log-body"><tr><td colspan="8" class="log-empty">加载中…</td></tr></tbody>

    <script>
    layui.use(['form', 'layer', 'laypage'], function () {
        var form = layui.form, layer = layui.layer, laypage = layui.laypage, $ = layui.jquery;
        var page = 1, size = 20;
        var FIXED = ['独立接口', '动态密钥接口', '脚本解析接口', 'JSON解析接口', '解析线路', '主解析API', '官替算法1', '官替算法2'];

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
            });
        }

        function extraText(e) {
            if (!e || typeof e !== 'object') { return ''; }
            var arr = [];
            for (var k in e) {
                if (!e.hasOwnProperty(k)) { continue; }
                var v = e[k];
                if (v === '' || v === null || v === undefined) { continue; }
                arr.push(k + '=' + (typeof v === 'object' ? JSON.stringify(v) : v));
            }
            return arr.join('，');
        }

        function fillModules(groups) {
            var sel = $('#f-module'), cur = sel.val() || '';
            var names = FIXED.slice();
            for (var k in groups) {
                if (groups.hasOwnProperty(k) && names.indexOf(k) === -1) { names.push(k); }
            }
            var html = '<option value="">全部模块</option>';
            for (var i = 0; i < names.length; i++) {
                html += '<option value="' + esc(names[i]) + '">' + esc(names[i]) + '</option>';
            }
            sel.html(html);
            if (cur) { sel.val(cur); }
            form.render('select');
        }

        function renderStats(stats) {
            $('#c-total').text(stats.total || 0);
            $('#c-success').text(stats.success || 0);
            $('#c-fail').text(stats.fail || 0);
            $('#c-rate').text((stats.rate || 0) + '%');
            $('#c-avg').text((stats.avg_ms || 0) + ' ms');

            var groups = stats.groups || {}, html = '', n = 0;
            for (var k in groups) {
                if (!groups.hasOwnProperty(k)) { continue; }
                var g = groups[k];
                var rate = g.total > 0 ? Math.round(g.success * 1000 / g.total) / 10 : 0;
                html += '<tr><td>' + esc(g.name || k) + '</td><td>' + g.total + '</td><td>' + g.success + '</td><td>' + g.fail + '</td><td>' + rate + '%</td><td>' + g.avg_ms + ' ms</td></tr>';
                n++;
            }
            $('#stat-body').html(n ? html : '<tr><td colspan="6" class="log-empty">暂无数据</td></tr>');
        }

        function renderRows(res) {
            var rows = res.rows || [], html = '';
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                var ok = r.status !== 'fail';
                html += '<tr>'
                    + '<td>' + esc(r.t) + '</td>'
                    + '<td>' + esc(r.module) + '</td>'
                    + '<td>' + esc(r.action) + '</td>'
                    + '<td><span class="log-tag ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '成功' : '失败') + '</span></td>'
                    + '<td>' + esc(r.code) + '</td>'
                    + '<td>' + esc(r.ms) + ' ms</td>'
                    + '<td>' + esc(r.ip) + '</td>'
                    + '<td class="log-extra">' + esc(extraText(r.extra)) + '</td>'
                    + '</tr>';
            }
            $('#log-body').html(html || '<tr><td colspan="8" class="log-empty">暂无数据</td></tr>');

            laypage.render({
                elem: 'pager',
                count: res.total || 0,
                curr: res.page || 1,
                limit: res.size || 20,
                limits: [20, 50, 100],
                layout: ['count', 'prev', 'page', 'next', 'limit'],
                jump: function (obj, first) {
                    if (first) { return; }
                    page = obj.curr;
                    size = obj.limit;
                    loadLog();
                }
            });
        }

        function loadLog() {
            var data = {
                type: 'log_call_list',
                days: $('#f-days').val(),
                module: $('#f-module').val(),
                status: $('#f-status').val(),
                kw: $('#f-kw').val(),
                page: page,
                size: size
            };
            $('#log-body').html('<tr><td colspan="8" class="log-empty">加载中…</td></tr>');
            $.post('admin.php', data, function (res) {
                if (!res || !res.ok) {
                    $('#log-body').html('<tr><td colspan="8" class="log-empty">加载失败</td></tr>');
                    return;
                }
                renderStats(res.stats || {});
                fillModules((res.stats && res.stats.groups) || {});
                renderRows(res);
            }, 'json').fail(function () {
                $('#log-body').html('<tr><td colspan="8" class="log-empty">请求失败，请检查登录状态</td></tr>');
            });
        }

        $('#btn-search').on('click', function () {
            page = 1;
            loadLog();
        });
        $('#f-days, #f-module, #f-status').on('change', function () {
            page = 1;
            loadLog();
        });
        $('#f-kw').on('keydown', function (e) {
            if (e.keyCode === 13) { page = 1; loadLog(); }
        });
        $('#btn-clear').on('click', function () {
            layer.confirm('确定要清空全部调用日志吗？该操作不可恢复。', {icon: 3, title: '清空调用日志'}, function (idx) {
                layer.close(idx);
                $.post('admin.php', {type: 'log_clear', kind: 'call'}, function (d) {
                    layer.msg(d && d.m ? d.m : '已清空', {icon: 1, time: 1200});
                    page = 1;
                    loadLog();
                }, 'json').fail(function () { layer.msg('操作失败', {icon: 5}); });
            });
        });

        form.render();
        loadLog();
    });
    </script>
</body>
</html>
