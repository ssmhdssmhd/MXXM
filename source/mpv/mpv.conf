# =============================================================================
# MXXM 推荐 MPV 配置 (v.0.0.3)
# 基于 Duke Enhanced / MPV_lazy 最佳实践整合
# 适用平台: Windows (gpu-next + d3d11)
# 将本文件放入 MPV 同级目录 portable_config/mpv.conf
# =============================================================================

# ---------- 视频输出 ----------
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
hwdec=d3d11va
hwdec-codecs=h264,hevc,vp9,av1,mpeg2video

# ---------- 色彩管理 ----------
target-colorspace-hint=yes
target-trc=bt.1886
target-prim=bt.709
# 自动切换到显示器原生色域（需显示器支持）
# target-prim=display
icc-cache-dir=~~/icc_cache
gpu-api=d3d11

# ---------- 缩放算法（画质优先）----------
# 缩小：ewa_lanczossharp（锐利但不产生振铃）
dscale=ewa_lanczossharp
dscale-param1=0.0
dscale-blur=0.95
# 放大：lanczos（内置，性能与画质均衡）
scale=lanczos
scale-param1=4
scale-blur=0.95
# 色度：spline36
cscale=spline36
cscale-param1=0.0
# 时间插值：mitchell（运动平滑）
tscale=mitchell
tscale-param1=0.33
tscale-blur=0.75

# ---------- 高级画质（可选着色器，需下载对应 GLSL）----------
# 放大着色器：QCOM_SGEDS_ms_RT（高通超分，画质极佳）
# glsl-shaders-clr
# glsl-shaders="~~/shaders/QCOM_SGEDS_ms_RT.glsl"
# 色度着色器：GLSL Chroma from Luma (CfL) Prediction
# glsl-shaders="~~/shaders/CfL_Prediction.glsl"
# 去色带：hdeband（高质量去色带）
# glsl-shaders="~~/shaders/hdeband.glsl"

# ---------- 反交错 ----------
deinterlace=no
vf=no

# ---------- 去色带（内置，无需着色器）----------
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=0

# ---------- 帧时序与同步 ----------
video-sync=display-resample
interpolation=yes
# 仅在高刷新率显示器或有需要时开启补帧
# interpolation=yes
# tscale=box

# ---------- 缓冲与缓存 ----------
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB
cache-default=256MiB
cache-secs=120

# ---------- 音频 ----------
audio-samplerate=48000
audio-format=s32
ao=wasapi
# 音频归一化（可选）
# af=loudnorm=I=-16:TP=-1.5:LRA=11

# ---------- 字幕 ----------
sub-auto=fuzzy
sub-file-paths=sub:subs:字幕
sub-gauss=0.4
sub-color="#ffffffff"
sub-border-color="#00000099"
sub-font-size=52
sub-font="Microsoft YaHei"
sub-shadow-offset=1
sub-shadow-color="#00000066"
# 弹幕（需 uosc_danmaku 脚本）
# sub-file=...

# ---------- OSD / 界面 ----------
osd-font="Microsoft YaHei"
osd-font-size=36
osd-color="#ffffffff"
osd-border-color="#00000099"
osd-align-x=center
osd-align-y=center
osd-bar-align-y=-1
osd-duration=1500
# 使用 uosc 替代默认 OSC（需脚本）
osc=no
# uosc 配置（需 uosc 脚本）
# script-opts=uosc-minimap=no,uosc-show_volume=no,uosc-show_duration=no

# ---------- 窗口 ----------
keep-open=yes
keep-open-pause=no
window-maximized=no
# 启动时窗口大小
# geometry=1280x720
autofit=90%x90%
# 屏幕截图
screenshot-format=png
screenshot-png-compression=9
screenshot-template="mpv-shot%n-%t"
screenshot-directory="~~/screenshots"

# ---------- 网络 ----------
user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
# Referer 与 UA 透传（用于解析视频直链）
# http-header-fields="Referer: https://www.iqiyi.com/"
network-timeout=30

# ---------- 脚本（需将对应脚本放入 scripts/ 目录）----------
# scripts=uosc.lua
# scripts=thumbfast.lua
# scripts=mpv360.lua
# scripts=uosc_danmaku.lua
# script-opts=thumbfast-max_height=1080,thumbfast-quickness=0.5

# ---------- 日志 ----------
log-file="~~/mpv.log"
msg-level=all=warn

# ---------- 杂项 ----------
force-window=yes
cursor-autohide=1000
loop-playlist=inf
priority=high
save-position-on-quit=yes
