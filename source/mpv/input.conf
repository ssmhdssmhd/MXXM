# =============================================================================
# MXXM 推荐 MPV 快捷键 (v.0.0.3)
# 整合 Duke Enhanced 常用快捷键 + uosc / mpv360 / uosc_danmaku
# 将本文件放入 MPV 同级目录 portable_config/input.conf
# =============================================================================

# ---------- 播放控制 ----------
SPACE              cycle pause
p                  cycle pause
.                  frame-step
,                  frame-back-step
q                  quit
Q                  quit-watch-later
ESC                quit

# ---------- 进度跳转 ----------
LEFT               seek -5
RIGHT              seek 5
UP                 seek 30
DOWN               seek -30
Shift+LEFT         seek -60
Shift+RIGHT        seek 60
PGUP               add chapter -1
PGDWN              add chapter 1
HOME               seek 0 absolute
END                seek 100 absolute-percent

# ---------- 从头播放 / 翻转（Duke Enhanced 风格）----------
r                  set start 0; seek 0 absolute        # 从头播放
f                  vf toggle hflip                     # 水平翻转
F                  vf toggle vflip                     # 垂直翻转

# ---------- 倍速 ----------
[                  multiply speed 0.90
]                  multiply speed 1.10
{                  multiply speed 0.5
}                  multiply speed 2.0
BACKSPACE          set speed 1.0
d                  cycle-values speed 1.0 2.0          # 切换 2 倍速

# ---------- 音量 ----------
m                  cycle mute
/                  add volume -5
*                  add volume 5
9                  add volume -5
0                  add volume 5
VOLUME_DOWN        add volume -5
VOLUME_UP          add volume 5
MUTE               cycle mute

# ---------- 画面缩放 ----------
Ctrl+f             add video-zoom 0.1                  # 放大
Ctrl+d             add video-zoom -0.1                 # 缩小
Ctrl+0             set video-zoom 0; set video-pan-x 0; set video-pan-y 0
Alt+UP             add video-pan-y -0.05
Alt+DOWN           add video-pan-y 0.05
Alt+LEFT           add video-pan-x -0.05
Alt+RIGHT          add video-pan-x 0.05

# ---------- 全屏 ----------
F11                cycle fullscreen
LMBTWN             cycle fullscreen

# ---------- 轨道切换 ----------
j                  cycle sub
J                  cycle sub down
a                  cycle audio
v                  cycle sub-visibility

# ---------- 字幕 ----------
z                  add sub-delay -0.1
x                  add sub-delay 0.1
Shift+z            add sub-pos -1
Shift+x            add sub-pos 1
o                  add sub-scale -0.02
Shift+o            add sub-scale 0.02

# ---------- MediaInfo ----------
Alt+i              script-binding uosc/stats            # 常驻显示/关闭 MediaInfo（需 uosc）
i                  script-binding stats/display-stats-toggle

# ---------- VR / 360 视频（需 mpv360 脚本）----------
Alt+e              script-binding mpv360/enable         # 开启 VR 视频模式
Alt+Mouse_BTN0     script-binding mpv360/mouse-look     # 鼠标控制视角
Alt+UP             script-binding mpv360/look-up
Alt+DOWN           script-binding mpv360/look-down
Alt+LEFT           script-binding mpv360/look-left
Alt+RIGHT          script-binding mpv360/look-right

# ---------- 弹幕（需 uosc_danmaku 脚本）----------
b                  script-binding uosc_danmaku/toggle   # 弹幕开关
B                  script-binding uosc_danmaku/search   # 弹幕搜索

# ---------- 截图 ----------
s                  screenshot
S                  screenshot video
Ctrl+s             screenshot subtitles

# ---------- 播放列表 ----------
l                  script-binding uosc/playlist
ENTER              playlist-next

# ---------- uosc 控件（需 uosc 脚本）----------
RMB                script-binding uosc/menu
MBTN_MID           script-binding uosc/menu
F1                 script-binding uosc/help
F2                 script-binding uosc/menu
F3                 script-binding uosc/load-subtitles
F4                 script-binding uosc/load-audio
F5                 script-binding uosc/select-video
F6                 script-binding uosc/select-audio
F7                 script-binding uosc/select-subtitle
F8                 show-text "${track-list}" 5000
